name: android
on:
  push:
    branches: ['**']
    # the phone app, and the desktop engine files it compiles in
    paths: ['android/**', '.github/workflows/android.yml', 'backline/src/data/**', 'backline/src/audio/**']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "android -> target"
          cache-on-failure: true
      - name: Build the APK
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          # the JavaScript engine's bindings are generated against the phone's own headers
          sysroot="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--target=aarch64-linux-android26 --sysroot=$sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--target=x86_64-linux-android26 --sysroot=$sysroot"
          cargo install cargo-apk --locked
          # a throwaway signing key for test builds (a lasting one comes before the APK is handed out)
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -alias test -storepass testpass -keypass testpass             -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Backline test"
          cd android
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/test.jks"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=testpass
          cargo apk build --release
          mkdir -p "$GITHUB_WORKSPACE/out"
          apk=$(find target -name '*.apk' | head -1)
          # signed again with Android's own tools (v2/v3 signatures: newer phones refuse the older kind)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass pass:testpass --key-pass pass:testpass             --out "$GITHUB_WORKSPACE/out/backline.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs "$GITHUB_WORKSPACE/out/backline.apk" | head -3
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@v4
        with:
          name: backline-apk
          path: out/backline.apk
