[package]
name = "backline"
version = "0.1.0"
edition = "2021"
description = "Backline - a retro desktop player for Tidal."

[features]
# `--no-default-features` builds the plain Tidal player without the practice tools
default = ["practice"]
practice = []

[dependencies]
ab_glyph = "0.2"
# the big system fonts for other scripts are mapped from disk, not copied into memory
memmap2 = "0.9"
# no accesskit: every widget is hand-painted, so it had nothing to describe (and cost a second Windows API crate)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
# native-tls = Windows' own certificate store, so corporate/IT proxy certs are trusted
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "flac", "mp3", "alac", "pcm", "wav", "ogg", "vorbis"] }
# output only: decoding is our own symphonia SymSource
rodio = { version = "0.19", default-features = false }
webbrowser = "1"
# native file dialogs (ADD FILES / ADD FOLDER)
rfd = { version = "0.15", default-features = false }
dirs = "5"
base64 = "0.22"
# stem separation: ONNX Runtime is loaded from a DLL that is downloaded on demand (nothing is linked in)
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# the stems runtime for Mac and Linux comes as .tgz
flate2 = "1"
tar = { version = "0.4", default-features = false }
quick-xml = "0.37"
swash = "0.1"
lofty = "0.22"

# the real macOS menu bar
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
souvlaki = { version = "0.8", default-features = false }
windows = { version = "0.44", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
# thin LTO + a few codegen units: a much faster build, with run speed within a hair of full LTO
lto = "thin"
codegen-units = 8
strip = true

# day-to-day builds: line numbers in our own code are enough, none in libraries -> much less to link
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
