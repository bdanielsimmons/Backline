[package]
name = "backline-android"
version = "0.1.0"
edition = "2021"

# Backline for Android phones: a lean player and practice app (step 1: the build works, the screen draws, sound plays)
[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
rodio = { version = "0.19", default-features = false }
# the desktop engine's own libraries (rustls: the phone has no Windows certificate store)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "flac", "mp3", "alac", "pcm", "wav", "ogg", "vorbis"] }
webbrowser = "1"

[package.metadata.android]
package = "com.v9studio.backline"
apk_name = "backline"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Backline"

[package.metadata.android.application.activity]
orientation = "portrait"

[profile.release]
opt-level = "s"
strip = true
